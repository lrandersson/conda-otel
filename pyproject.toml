[build-system]
build-backend = "hatchling.build"
requires = ["hatchling >=1.12.2"]

[project]
dependencies = [
  "conda >=26.5",
  "opentelemetry-sdk >=1.40,<1.44",
]
description = "A conda plugin that captures vendor-neutral events and sends them to registered providers"
license = { file = "LICENSE" }
name = "conda-otel"
readme = "README.md"
requires-python = ">=3.11"
version = "0.0.1"

[project.urls]
Homepage = "https://github.com/lrandersson/conda-otel"

[project.entry-points.conda]
conda-otel = "conda_otel.hooks"

[tool.hatch.build.targets.wheel]
packages = ["conda_otel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
