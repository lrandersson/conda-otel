[build-system]
build-backend = "hatchling.build"
requires = ["hatchling >=1.12.2"]

[project]
dependencies = [
  "conda >=26.5",
  "pluggy >=1.6.0",
  "opentelemetry-sdk >=1.40,<1.44",
]
description = "A conda plugin that captures vendor-neutral events and sends them to registered providers"
license = { file = "LICENSE" }
name = "conda-otel"
readme = "README.md"
requires-python = ">=3.11"
version = "0.0.1"

[project.urls]
Homepage = "https://github.com/lrandersson/conda-otel"

[project.entry-points.conda]
conda-otel = "conda_otel.hooks"

[tool.hatch.build.targets.wheel]
packages = ["conda_otel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
show-fixes = true

[tool.ruff.lint]
flake8-type-checking = { exempt-modules = [], strict = true }
# see https://docs.astral.sh/ruff/rules/
select = [
  "B012",  # bugbear
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "FA",  # flake8-future-annotations
  "G",  # flake8-logging-format
  "I",  # isort
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "RUF100",  # Unused noqa directive
  "T10",  # flake8-debugger
  "TC",  # flake8-type-checking
  "UP",  # pyupgrade
  "W",  # pycodestyle warnings
]
